  <text x="320" y="532" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="52" fill="#ffffff" fill-opacity="0.92" text-anchor="middle" letter-spacing="4">TE·03</text>
  <text x="320" y="572" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="6">SUNO PREMIER · SESSIONS</text>
