<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.72" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#a21caf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="scan" width="640" height="6" patternUnits="userSpaceOnUse">
      <rect width="640" height="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#grid)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <!-- halo catedral -->
  <circle cx="320" cy="300" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="320" cy="300" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="320" cy="300" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <line x1="320" y1="300" x2="320" y2="70"/>
    <line x1="320" y1="300" x2="150" y2="150"/>
    <line x1="320" y1="300" x2="490" y2="150"/>
    <line x1="320" y1="300" x2="105" y2="300"/>
    <line x1="320" y1="300" x2="535" y2="300"/>
  </g>
  <circle cx="320" cy="300" r="10" fill="#ffffff" fill-opacity="0.85"/>
  <text x="320" y="520" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="58" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="6">TE·01</text>
  <text x="320" y="566" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ffffff" fill-opacity="0.65" text-anchor="middle" letter-spacing="8">THORNADO EORG — 2026</text>
  <rect width="640" height="640" fill="url(#scan)"/>
