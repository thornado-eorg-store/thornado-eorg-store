<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#7c1d6f"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.7" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="scan" width="640" height="6" patternUnits="userSpaceOnUse">
      <rect width="640" height="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#grid)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <!-- ráfaga solar -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="3">
    <line x1="320" y1="300" x2="320" y2="88"/>
    <line x1="320" y1="300" x2="320" y2="512"/>
    <line x1="320" y1="300" x2="108" y2="300"/>
    <line x1="320" y1="300" x2="532" y2="300"/>
    <line x1="320" y1="300" x2="160" y2="140"/>
    <line x1="320" y1="300" x2="480" y2="140"/>
    <line x1="320" y1="300" x2="160" y2="460"/>
    <line x1="320" y1="300" x2="480" y2="460"/>
  </g>
  <circle cx="320" cy="300" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="320" cy="300" r="52" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="320" cy="300" r="14" fill="#ffffff" fill-opacity="0.95"/>
  <text x="320" y="580" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="54" fill="#ffffff" fill-opacity="0.92" text-anchor="middle" letter-spacing="6">TE·05</text>
  <rect width="640" height="640" fill="url(#scan)"/>
</svg>
